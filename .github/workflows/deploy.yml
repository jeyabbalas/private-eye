name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Cache the build-time layout model fetch (~130 MB, sha-pinned & stable)
      # so prepare-build doesn't re-download it on every run.
      - name: Cache layout model
        uses: actions/cache@v4
        with:
          path: models
          key: models-doclayoutv3-${{ hashFiles('scripts/fetch-models.ts', 'scripts/patch-layout.ts') }}

      - run: npm ci

      # prepare-build (patch wllama + layout, stage vendored assets) then vite build
      - run: npm run build

      - run: npm run typecheck

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
