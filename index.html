<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Private Eye — privacy-preserving OCR. Digitize PDFs and images into Markdown entirely in your browser. Nothing is uploaded."
    />
    <title>Private Eye — privacy-preserving OCR</title>
    <script type="module">
      // Register the COOP/COEP service worker from a base-correct URL so the
      // Deep Read model can run multithreaded on GitHub Pages (which cannot send
      // the headers itself). It reloads the page once on the first visit to
      // become cross-origin-isolated. In dev, Vite already sends the headers, so
      // the shim detects isolation and does nothing.
      //
      // Force `credentialless` COEP (the shim defaults to require-corp on
      // Chrome/Firefox): the cross-origin HuggingFace model weights carry no
      // Cross-Origin-Resource-Policy, so require-corp would block them. With
      // credentialless they load (without credentials) while isolation — and the
      // threads wllama needs — stay on. This matches the dev/preview headers.
      window.coi = { coepCredentialless: () => true };
      if ('serviceWorker' in navigator && window.isSecureContext) {
        const s = document.createElement('script');
        s.src = new URL(import.meta.env.BASE_URL + 'coi-serviceworker.js', location.href).href;
        document.head.appendChild(s);
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
